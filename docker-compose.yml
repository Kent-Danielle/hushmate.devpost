services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hushmate
      POSTGRES_PASSWORD: hushmate
      POSTGRES_DB: hushmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/10-db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hushmate -d hushmate"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    # Regenerate the Prisma client first: the bind mount hides the image's copy.
    command: sh -c "npx prisma generate && npm run start:dev"
    env_file: backend/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    env_file: frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:

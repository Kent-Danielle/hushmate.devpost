app = "hushmate-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30
swap_size_mb = 512

[deploy]
  strategy = "rolling"
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
